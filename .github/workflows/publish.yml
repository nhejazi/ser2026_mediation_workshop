on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
name: Quarto Publish
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y curl cmake libcurl4-doc libcurl4-openssl-dev \
            libharfbuzz-dev libfribidi-dev libmagick++-dev libpoppler-cpp-dev \
            libglpk-dev libuv1-dev coinor-symphony coinor-libsymphony-dev \
            gsfonts pandoc
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install R dependencies via renv
        uses: r-lib/actions/setup-renv@v2
        # Claude notes: This is a workaround for the issue where renv fails to
        # install packages from RSPM (Posit Package Manager) when versions are
        # too new to have been posted. Overriding with CRAN slows down builds
        # but resolves failure due to unavailability of packages.
        env:
          RENV_CONFIG_REPOS_OVERRIDE: "https://cloud.r-project.org"
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    # - name: Install Torch dependencies
    #   run: Rscript -e 'torch::install_torch(); renv::snapshot()'
